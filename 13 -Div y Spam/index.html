<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Y Spam</title>
</head>
<style>
    h2{
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background-color: #e7e7e7;
    }


    .calculo{
        font-family: 'Courier New', Courier, monospace;
        background-color: rgb(201,201,201);
        max-width: 150px;
    }

    span{  /* div para grupo de etiquetas y span para seleccionar partes de texto */ 
        color: red;
        font-weight: bolder;
    }

/* spam es para seleccionar partes de un texto */

</style>

<body>

    <h2>Operaciones Matematicas</h2>
    <P>las matematicas son importantes</P>
    <p>Nos permiten hacer calculos</p>

    <div class="calculo">
        <p>5 + 8 = <span>13</span></p>
        <p>10 - 6 = <span>4</span></p>
        <p>3 * 10 = <span>30</span></p>
    </div>

    <p>Esisten muchas operaciones distintas</p>
    <p>Pronto veremos como manjearlas</p>

</body>
</html>
