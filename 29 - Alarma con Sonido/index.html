<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetTimeout</title>
</head>
<body>
    
<input type="number" id="tiempoElejido">
<button onclick="comenzarTiempo()">Alarma</button>
<h1 id="textoAlarma" style="color: red">Apagado</h1>

<!--Audio-->
<audio id ="audioAlarma">
        <source src="./sonido.mp3" type="audio/mpeg">
        Sonido no habilidado
</audio>
<!--Audio-->


<script>
    let elementosSegundos = document.getElementById("tiempoElejido");
    let elementoTextoAlarma = document.getElementById("textoAlarma");
    let elementoSonidoAlarma = document.getElementById("audioAlarma");


    function comenzarTiempo() {
        setTimeout(tiempoCumplido, 1000*elementosSegundos.value);
        
    }

    function tiempoCumplido() {
        elementoTextoAlarma.textContent = "Encendido";
        elementoTextoAlarma.style.color = "green";
        elementoSonidoAlarma.play();
        
    }

</script>

</body>
</html>
