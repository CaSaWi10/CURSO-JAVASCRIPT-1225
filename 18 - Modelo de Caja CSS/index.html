<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Caja y Flexbox</title>
   <style>
    .caja{
        width: 200px;
        height: 100px;
        background-color: lightblue;
        padding: 20px; /* lo q esta alrededor del contenido */

   </style>
</head>
<body>

    <div class="caja">
        Este es mi contenido
    </div>
    

</body>
