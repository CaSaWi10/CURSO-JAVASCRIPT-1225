    <style> /* aca el script es para css */
        body{background-color: darkcyan;}
    </style>
</head>
<body>
    <script>
        function ponertituloRojo() {
            document.getElementById("titulo").style="color: red";
           
       
        }

         function ponerenazul() {
            document.getElementById("segundo").style="color: green";
            document.getElementById
            
        }

        function fuerade() {    /* aca el nombre de la funcion la pusimos a la par del evento o la accion a realizar || */
            document.getElementById("segundo").style="color: white"; /* document nos ayuda a que por el ID podemos hacer cambios en ese ID, el style llama para hacer los cambios */
            
        }
    </script>
    
<h1 id="titulo" onmouseover="ponertituloRojo()">Bienvenido a JavaScript</h1> <!--Orden es id = al identificador para trabajarlo en css || la accion q va a realizarse es = onmouseover || el nombre con el cual vamos a llamar a la funcion para hacer q funcione -->
<h2 id="segundo" onmouseover="ponerenazul()" onmouseleave="fuerade()">El Primer paso es el mas grande</h2>
